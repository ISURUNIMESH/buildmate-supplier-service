spring.application.name=order-inventory-service
server.port=${SERVER_PORT:28087}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27023/order_inventory_db}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27023/order_inventory_db}
spring.mongodb.database=order_inventory_db
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# RabbitMQ (OrderCreatedEvent producer / PaymentCompleted consumer)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:25672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
# Do not block service startup if broker is temporarily unavailable
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.multiplier=2.0
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.auto-startup=true
management.health.rabbit.enabled=false
