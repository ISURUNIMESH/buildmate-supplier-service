# BuildMate CD — prepare/build Docker images only (no deploy, no registry push, no secrets)
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-images:
    name: Build image (${{ matrix.image }})
    runs-on: ubuntu-latest
    # Only after a successful CI run triggered by a push to main (not PRs).
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: auth-server
            image: buildmate/auth-server
          - context: api-gateway
            image: buildmate/api-gateway
          - context: supplier-service
            image: buildmate/supplier-service
          - context: material-service-main
            image: buildmate/material-service
          - context: payment-service-main
            image: buildmate/payment-service
          - context: order-inventory-service-main
            image: buildmate/order-inventory-service
          - context: buildmate-client
            image: buildmate/client
    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push / no deploy)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: false
          load: false
          tags: |
            ${{ matrix.image }}:ci-${{ github.event.workflow_run.head_sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
